<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="scripts/const.js"></script>
    <script src="scripts/calculator.js"></script>
    <title>Fallout 76 Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Fallout 76 Tools</h1>
    <p>Welcome to the Fallout 76 Tools application.</p>
    <p>I want</p>
    <pre id="output1"></pre>
    <p>I have</p>
    <pre id="output2"></pre>
    <p>I need</p>
    <pre id="output3"></pre>
</body>
<script>
    //DEBUG SCRIPT
    const x = 1;

    const result = getFromAmount("m", x);
    let text = "";

    Object.keys(result).sort().forEach(key => {
        text += `${HUMAN_READABLE.es_la[key]} (${key}): ${result[key]}\n`;
    });

    document.getElementById("output1").textContent = text;
    text = "";
    let list =  {
        a: 0,
        b: 0,
        c: 0,
        d: 0,
        e: 0,
        f: 0,
        g: 0,
        h: 0,
        i: 0,
        j: 0,
        k: 0,
        l: 0,
    };

    text = "";
    Object.keys(list).sort().forEach(key => {
        text += `${HUMAN_READABLE.es_la[key]} (${key}): ${list[key]}\n`;
    });
    document.getElementById("output2").textContent = text;
    text = "";
    let r = getMaxCraftable("m", list);
    Object.keys(r.missingForNext).sort().forEach(key => {
        text += `${HUMAN_READABLE.es_la[key]} (${key}): ${r.missingForNext[key]}\n`;
    });
    text += `Max craftable: ${r.maxCraftable}\n\n`;

    document.getElementById("output3").textContent = text;
</script>
</html>
